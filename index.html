<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Download de arquivos</title>
    <style>
        body {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
            display: flex;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            background: #f7f7f8;
            margin: 0
        }

        .card {
            background: #fff;
            border: 1px solid #e6e6e9;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 6px 18px rgba(23, 23, 23, 0.06);
            text-align: center
        }

        a.btn {
            display: inline-block;
            padding: 0.75rem 1.25rem;
            background: #0069ff;
            color: #fff;
            text-decoration: none;
            border-radius: 6px
        }

        p {
            margin: 0 0 1rem
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Baixar arquivos</h1>
        <p>Clique no botão abaixo para baixar o arquivo zip contendo os arquivos.</p>
        <a class="btn" href="./files.zip" download>Baixar arquivos</a>
    </div>
</body>

</html>
